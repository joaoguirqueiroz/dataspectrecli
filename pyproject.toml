[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataspectre-cli"
version = "2.0.2"
description = "Terminal-first defensive intelligence and authorized security auditing CLI."
requires-python = ">=3.10"
authors = [{ name = "DataSpectre" }]
dependencies = ["rich>=13.7", "PyYAML>=6.0"]

[project.scripts]
dataspectre = "cli.app:main"

[tool.setuptools.packages.find]
include = ["app*", "cli*", "core*", "modules*", "plugins*", "scripts*", "services*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
